[mgr]
ratio = [0, 4, 3]
show_hidden = true
show_symlink = true
sort_by = "natural"
sort_dir_first = true
sort_sensitive = false
linemode = "size_and_mtime"

[opener]
play = [
	{ run = "mpv %s", orphan = true, for = "unix", desc = "Open with MPV" },
]
listen = [
	{ run = "mpv --no-video --term-osd-bar %s", block = true, for = "unix", desc = "Play in terminal" },
	{ run = "mpv --player-operation-mode=pseudo-gui %s", orphan = true, for = "unix", desc = "Play in mpv window" },
]
edit = [
	{ run = "$EDITOR %s", block = true, for = "unix" },
]
# Image viewer: swayimg on the hovered image, with the rest of its directory loaded around it
view = [
	{ run = "swayimg -e 'swayimg.imagelist.adjacent = true; swayimg.imagelist.order = \"numeric\"' %s1", orphan = true, for = "linux", desc = "View in swayimg (whole directory)" },
]
open = [
	{ run = "xdg-open %s", orphan = true, desc = "Open", for = "linux" },
	{ run = "open %s", desc = "Open", for = "macos" },
]

[open]
#	{ run = "xdg-open %s", desc = "Open" },
prepend_rules = [
	{ mime = "text/*", use = "edit" },
	{ mime = "video/*", use = "play" },
	{ mime = "audio/*", use = "listen" },
	{ mime = "image/*", use = [ "view", "open", "reveal" ] },

	# Multiple openers for a single rule
	{ url = "*.html", use = [ "open", "edit" ] },
]

[preview]
wrap = "yes"
image_quality = 50
# Smaller than the stock 600x900: less to scale and transmit per image
max_width = 480
max_height = 720

[tasks]
# Preload tasks never show up in the task list or the "unfinished tasks" quit prompt
suppress_preload = true

[plugin]
# No background thumbnailing of the visible page: previews are generated only for the
# hovered file, and only while the preview pane is open (see plugins/lazy-preview.yazi).
# <Space>t switches the thumbnail cache on for the session (plugins/on-demand.yazi).
preloaders = []

# Git status signs are off by default; <Space>g switches them on (plugins/on-demand.yazi).

# /mnt/main (sshfs): MIME strictly by extension, never runs `file`.
# Everywhere else: mime-ext (see init.lua) - extension database, `file` only for unknown names.
[[plugin.prepend_fetchers]]
group = "mime"
url = "/mnt/main/**"
run = "mime-strict"
prio = "high"

[[plugin.prepend_fetchers]]
group = "mime"
url = "local://*"
run = "mime-ext.local"
prio = "high"

# Archives: no `7z l` listing on hover; open them in File Roller with ";a" instead.
[[plugin.prepend_previewers]]
mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}"
run = "nopreview"

[[plugin.prepend_previewers]]
mime = "application/{debian*-package,redhat-package-manager,rpm,android.package-archive}"
run = "nopreview"

[[plugin.prepend_previewers]]
mime = "application/{iso9660-image,qemu-disk,ms-wim,apple-diskimage}"
run = "nopreview"

[[plugin.prepend_previewers]]
url = "*.{AppImage,appimage,img,fat,ext,ext2,ext3,ext4,squashfs,ntfs,hfs,hfsx}"
run = "nopreview"
