[mgr]
show_hidden = true
show_symlink = true
sort_by = "natural"
sort_dir_first = true
sort_sensitive = false
linemode = "size_and_mtime"

[opener]
play = [
	{ run = "mpv %s", orphan = true, for = "unix", desc = "Open with MPV" },
	{ run = "vlc %s", orphan = true, for = "unix", desc = "Open with VLC" },
]
listen = [
	{ run = "mpv --no-video --term-osd-bar %s", block = true, for = "unix", desc = "Play in terminal" },
	{ run = "mpv --player-operation-mode=pseudo-gui %s", orphan = true, for = "unix", desc = "Play in mpv window" },
]
edit = [
	{ run = "$EDITOR %s", block = true, for = "unix" },
	{ run = "$EDITOR %s", block = true, for = "macos" },
]
open = [
	{ run = "xdg-open %s", desc = "Open" },
]

[open]
#	{ run = "xdg-open %s", desc = "Open" },
prepend_rules = [
	{ mime = "text/*", use = "edit" },
	{ mime = "video/*", use = "play" },
	{ mime = "audio/*", use = "listen" },

	# { mime = "application/json", use = "edit" },
	{ url = "*.json", use = "edit" },

	# Multiple openers for a single rule
	{ url = "*.html", use = [ "open", "edit" ] },
]

[preview]
wrap = "yes"
image_quality = 50

[[plugin.prepend_fetchers]]
group = "git"
url = "*"
run = "git"

[[plugin.prepend_fetchers]]
group = "git"
url = "*/"
run = "git"
