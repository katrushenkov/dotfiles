[mgr]
prepend_keymap = [
  { on = [ "l" ], run = "plugin smart-enter", desc = "Enter the child directory, or open the file"},
  { on = [ "<Enter>" ], run = "plugin smart-enter", desc = "Enter the child directory, or open the file"},
  { on = [ "!" ], run = 'shell "$SHELL" --block', desc = "Open $SHELL here"},
  { on = [ "<Space>", "m" ], run = "plugin mount", desc = "Displays mount dialog"},
  { on = [ "<Space>", "q" ], run = "quit", desc = "Quit yazi" },
  { on = [ "<Space>", "p" ], run = "plugin lazy-preview min-preview", desc = "Show/hide the preview pane" },
  { on = [ "<Space>", "<S-p>" ], run = "plugin lazy-preview max-preview", desc = "Maximize/restore the preview pane" },
  { on = [ "<Space>", "g" ], run = "plugin on-demand git", desc = "Toggle git status signs" },
  { on = [ "<Space>", "t" ], run = "plugin on-demand thumbs", desc = "Toggle background thumbnail cache" },
  { on = [ "<Space>", 's'], run  = "plugin what-size", desc = "Calc size of selection or cwd" },
  { on = [ "<Space>", '<S-s>'], run  = "plugin what-size -- --clipboard", desc = "Calc size of selection or cwd, copy to clipboard" },

  { on = [";","g"], run = "plugin bunny fuzzy", desc = "Start bunny.yazi fuzzy search"},
  { on = ["'"], run = "plugin bunny fuzzy", desc = "Start bunny.yazi fuzzy search"},
  #{ on = [";","g"], run = "plugin bunny", desc = "Start bunny.yazi"},

  # ";" leader
  { on = [";", ";"], run = "shell --interactive", desc = "Run a shell command" },
  { on = [";", "w"], run = "shell 'swayimg --gallery' --orphan", desc = "Open cwd images in swayimg gallery" },
  { on = [";", "r"], run = "shell 'lazygit' --block", desc = "Open lazygit in cwd" },
  { on = [";", "e"], run = "shell 'nvim' --block", desc = "Open neovim in cwd" },
  { on = [";", "d"], run = "shell 'nvim -d %s' --block", desc = "Diff selected files in nvim" },
  { on = [";", "x"], run = "plugin fzf-open", desc = "fzf search and open the chosen file" },
  { on = [";", "a"], run = "shell 'file-roller %h' --orphan", desc = "Open archive in File Roller" },

  { on = "/", run = "plugin filter-open", desc = "Filter; Enter opens the hovered item" },
  { on = "f", run = "find --smart", desc = "Find next file" },
  { on = "-", run = "back", desc = "Go back to the previous directory" },

  { on = "b", run = [ "toggle", "arrow next" ], desc = "Toggle the current selection state" },

	{ on = "<C-j>", run = "seek +2", desc = "Scroll preview" },
	{ on = "<C-k>", run = "seek -2", desc = "Scroll preview" },

  { on = "<S-l>", desc = "Move to the tab on the right", run = "tab_switch 1 --relative" },
  { on = "<S-h>", desc = "Move to the tab on the left", run = "tab_switch -1 --relative" },
  { on = ["c", 'm'], desc = "Change file mod", run = "plugin chmod"},
  { on = ["<Space>", 'c'], desc = "Compress file", run = "plugin compress" },

  # Real customizations over the yazi defaults (the rest of [mgr] now inherits stock keymap-default.toml)
  { on = "e", run = "shell '$EDITOR %s' --block", desc = "Edit with $EDITOR (regardless of file type)" },
  { on = "E", run = "open --interactive", desc = "Open with..." },
  { on = "t", run = "tab_create --current", desc = "Create a new tab with CWD" },

]
append_keymap = [
  { on = ['c', 'v'], desc = "Drag selected files", run = "shell 'ripdrag -x -a -n %s' --orphan" }
]

[pick]
prepend_keymap = [
  { on = "<C-k>", run = "arrow -1", desc = "Previous option" },
  { on = "<C-j>", run = "arrow 1",  desc = "Next option" },
  # { on = "<Enter>", run = [ "close --submit", "mgr:shell -- ya emit close --no-cwd-file" ], desc = "Submit the pick" }, # open file & close yazi
]

[input]

# Real customizations over the yazi defaults (the rest of [input] now inherits stock keymap-default.toml)
prepend_keymap = [
	{ on = "<Esc>",     run = "close",                       desc = "Cancel input (no vim normal mode)" },
	{ on = "<A-b>",     run = "backward",                    desc = "Move back to the start of the current or previous word" },
	{ on = "<A-f>",     run = "forward --end-of-word",       desc = "Move forward to the end of the current or next word" },
	{ on = "<C-Left>",  run = "backward",                    desc = "Move back to the start of the current or previous word" },
	{ on = "<C-Right>", run = "forward --end-of-word",       desc = "Move forward to the end of the current or next word" },
]

[help]

# Real customization over the yazi defaults (the rest of [help] now inherits stock keymap-default.toml)
prepend_keymap = [
	{ on = "f", run = "filter", desc = "Filter help items" },
]
