# tofi-rs theme: gruvbox (classic gruvbox dark palette)

[prompt]
text = "> "
padding = 6

[results]
count = 0
spacing = 4
mode = "vertical"

[text]
color = "#ebdbb2"
prompt_color = "#fabd2f"
input_color = "#ebdbb2"
match_color = "#a89984"
selection_color = "#fabd2f"
selection_match_color = "#fe8019"

[font]
name = "JetBrainsMono Nerd Font"
size = 14
hint = true

# Sizes are logical px for 1440x900 (eDP-1 @2x): tofi-rs scales "%" by the output's
# physical size, so percentages come out doubled on HiDPI.
[window]
anchor = "center"
width = 1152
height = 720
background_color = "#282828f2"
border_width = 2
border_color = "#fabd2f"
outline_width = 1
outline_color = "#1d2021"
corner_radius = 12
padding_top = 16
padding_bottom = 16
padding_left = 20
padding_right = 20
clip_to_padding = true
scale = true

[cursor]
hide = true

[input]
cursor = true
cursor_style = "bar"
cursor_color = "#fabd2f"
cursor_thickness = 2
