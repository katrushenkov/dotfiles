# delete current file (to trash) with confirmation
KP0 script-message-to delete_current_file delete-file KP1 "Press 1 to delete file"

# pause before the next file starts (toggle)
Alt+s script-binding pause_after_current_file/pause-after-current-file

# show OSC on seek with arrow keys too
RIGHT seek 5; script-message-to osc osc-show
LEFT  seek -5; script-message-to osc osc-show
