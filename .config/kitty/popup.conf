# Config for terminal-picker-kitty's popup panels (kitten panel). Same look as
# the main kitty, minus what only makes sense for a regular terminal window.
include kitty.conf

window_padding_width 8 12

# The popup process must not answer kitten @ / take part in Hyper+Return's
# socket lookup -- that is the main kitty's job.
allow_remote_control no
listen_on none

# The keeper panel lives forever; watching this file just keeps an extra
# kitten __watch_conf__ process waking up. Restart the keeper after edits.
auto_reload_config -1
