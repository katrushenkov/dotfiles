# Omarchy theme colors (override everforest.conf from kitty.conf)
include ~/.local/state/omarchy/current/theme/kitty.conf

font_family iA Writer Mono S
bold_italic_font auto
font_size 9.0
window_padding_width 14

# The compositor (Hyprland) tiles the windows, no client-side titlebar/shadow
hide_window_decorations yes

# Copy the selection if there is one, otherwise send SIGINT as usual
map ctrl+c copy_and_clear_or_interrupt

# Copy the output of the last command (needs shell integration)
map ctrl+shift+y launch --stdin-source=@last_cmd_output --type=clipboard

map ctrl+insert copy_to_clipboard
map shift+insert paste_from_clipboard
# Kitty legacy encoding sends Alt+Shift+Enter the same as Alt+Enter; send CSI-u so tmux can match M-S-Enter.
map alt+shift+enter send_text all \e[13;4u
# Send Shift+Enter as CSI-u so TUIs can distinguish it from Enter.
map shift+enter send_text all \e[13;2u

cursor_shape block
cursor_blink_interval 0
shell_integration no-cursor

tab_bar_edge                bottom
tab_bar_style               powerline
tab_powerline_style         slanted
tab_title_template          {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}

# Allow cwd lookup from Omarchy's global keybindings
listen_on unix:${XDG_RUNTIME_DIR}/omarchy-kitty-{kitty_pid}
# Allow remote control via the socket only (needed by nnn preview-tui splits)
allow_remote_control socket-only
