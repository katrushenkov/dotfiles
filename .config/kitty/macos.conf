#macos_traditional_fullscreen yes
# faster but less pretty
macos_titlebar_color background
macos_show_window_title_in none
# No titlebar and no close/minimize/zoom buttons (OmniWM tiles the windows
# anyway); titlebar-only keeps the rounded corners and shadow.
hide_window_decorations titlebar-only

# Left Option acts as Alt (Alt+B/F in the shell, nvim/fzf bindings); right
# Option still types special characters.
macos_option_as_alt left

# Remote control only through this socket (not from programs inside kitty via
# escape codes). Hammerspoon Hyper+Return uses it to open a new OS window in
# the running kitty. Takes effect after kitty restart.
allow_remote_control socket-only
listen_on unix:${TMPDIR}kitty-{kitty_pid}

# Copy the output of the last command (needs shell integration)
map cmd+shift+y launch --stdin-source=@last_cmd_output --type=clipboard
